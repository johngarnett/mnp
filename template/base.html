<!DOCTYPE html>
<html lang="en">
<head>

<!-- META -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>{{brand.titlePrefix}}: {{title}}</title>

<link rel="shortcut icon" href="/favicon.ico" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/3.0.3/normalize.css">
<link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet' type='text/css'>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.5/css/bootstrap.min.css" integrity="sha384-AysaV+vQoT3kOAXZkl02PThvDr8HYKPZhNT5h/CXfBThSRXQ6jW5DO2ekP5ViFdi" crossorigin="anonymous">
<link href="/base.css" rel="stylesheet" />
<link href="/brand.css" rel="stylesheet" />


{{#style}}
<style>
{{.}}
</style>
{{/style}}

</head>
<body>

<!-- TODO: Swap LOGIN/LOGOUT based on whether someone is logged in or not. -->

<!--
The following is a fairly good article on building a nav to change
layout/behavior between mobile of wide. However, it relies on the
:hover selector to expand/show the menu items, which is not useful
on mobile. I feel that if we move the ul:hover to a different
class, and use the toggle-button below to trigger that class
on and off, that it might be pretty close to ideal.
http://webdesignerwall.com/tutorials/css-responsive-navigation-menu
-->

<div class="nav-bar py-0" style="display: flex; justify-content: space-between; width: 100%;">
  <div class="btn-group">
    <button class="btn btn-secondary dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
      <img src="/icon_128.png" width="38" height="38" /><span class="px-1 text-uppercase">{{title}}</span>
    </button>
    <div class="dropdown-menu">
      <!-- The menus come from the branding's league.json (see docs/branding.md).
           An entry with "redirect": true sends the page's redirect_url along, for a login link. -->
      {{#mainMenu}}
      <a class="dropdown-item" href="{{{href}}}{{#redirect}}{{#redirect_url}}?redirect_url={{.}}{{/redirect_url}}{{/redirect}}">{{label}}</a>
      {{/mainMenu}}
    </div>
  </div>

  {{#hasPlayerMenu}}
  <div class="btn-group" style="width: 300px;">
    <button class="btn btn-secondary dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
      <img src="/icon_128.png" width="0" height="38" /><span class="px-1 text-uppercase">
        {{#playerFN}}
          {{playerFN}}
        {{/playerFN}}
        {{^playerFN}}
          PLAYER
        {{/playerFN}}
      </span>
    </button>
    <div class="dropdown-menu">
      {{#playerMenu}}
      <a class="dropdown-item" href="{{{href}}}{{#redirect}}{{#redirect_url}}?redirect_url={{.}}{{/redirect_url}}{{/redirect}}">{{label}}</a>
      {{/playerMenu}}
    </div>
  </div>
  {{/hasPlayerMenu}}
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js" integrity="sha384-3ceskX3iaEnIogmQchP8opvBy3Mi7Ce34nWjpBIwVTHfGYWQS9jwHDVRnpKKHJg7" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tether/1.3.7/js/tether.min.js" integrity="sha384-XTs3FgkjiBgo8qjEjBk0tGmf3wPrWtA6coPfQDfFEY8AnYJwjalXCiosYRBIBZX8" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.5/js/bootstrap.min.js" integrity="sha384-BLiI7JTZm+JWlgKa0M0kGRpJbF2J8q+qreVrKBC47e3K6BW78kGLrCkeRX6I9RoK" crossorigin="anonymous"></script>

<div id="content">
{{> content}}
</div>
<div style="color: white;">
<center>
{{#brand.copyright}}&copy;{{brand.copyright}}{{/brand.copyright}}
</center>
</div>

<script>
$(document).ready(function() {
    var $toggleButton = $('.toggle-button'),
        $menuWrap = $('.menu-wrap');

    $toggleButton.on('click', function() {
        $(this).toggleClass('button-open');
        $menuWrap.toggleClass('menu-show');
    });
});
</script>
</body>
</html>
